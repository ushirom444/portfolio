  </defs>

  <rect width="420" height="230" fill="url(#waterBg1)" rx="24"/>
  <rect x="1" y="1" width="418" height="228" fill="none" stroke="rgba(0,240,255,0.3)" stroke-width="1.5" rx="23"/>

